apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/version: "v1.0"
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: devops-ia
    app.kubernetes.io/managed-by: argocd
    environment: production
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: devops-ia
        environment: production
    spec:
      automountServiceAccountToken: true
      serviceAccountName: backend
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: 074994084847.dkr.ecr.us-east-1.amazonaws.com/devops-ia/production/backend
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: tmp
          emptyDir: {}
