apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: devops-ia-demo-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: devops-ia
    environment: production
spec:
  groups:
    - name: devops-ia.pods
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="app"}[5m]) * 300 > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} em CrashLoop"
            description: "Container {{ $labels.container }} reiniciou muitas vezes."

        - alert: ContainerImagePullFailed
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="app",
              reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"
            } == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Falha ao puxar imagem em {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} nao consegue puxar a imagem. Motivo: {{ $labels.reason }}."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="app"}
            !=
            kube_deployment_status_replicas_available{namespace="app"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.deployment }} com replicas divergentes"
            description: "Deployment {{ $labels.deployment }} esta com replicas insuficientes."

        - alert: ContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace="app",
              reason="OOMKilled"
            } == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "OOMKilled: {{ $labels.pod }}/{{ $labels.container }}"
            description: "Container {{ $labels.container }} foi encerrado por falta de memoria."
