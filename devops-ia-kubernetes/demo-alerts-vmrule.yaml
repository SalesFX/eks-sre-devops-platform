apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: devops-ia-demo-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: devops-ia
    environment: production
spec:
  groups:
    - name: devops-ia.pods
      interval: 30s
      rules:
        - alert: KubePodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="app"
            }[5m]) * 60 * 5 > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} em CrashLoop"
            description: "Container {{ $labels.container }} no pod {{ $labels.pod }} reiniciou {{ printf \"%.0f\" $value }} vezes nos ultimos 5 minutos."

        - alert: KubePodNotReady
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_phase{
                namespace="app",
                phase=~"Pending|Unknown|Failed"
              }
            ) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} nao esta pronto"
            description: "Pod {{ $labels.pod }} no namespace {{ $labels.namespace }} esta em estado {{ $labels.phase }} ha mais de 2 minutos."

        - alert: KubeDeploymentReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas{namespace="app"}
              !=
              kube_deployment_status_replicas_available{namespace="app"}
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} com replicas divergentes"
            description: "Deployment {{ $labels.deployment }} tem replicas desejadas diferentes das disponiveis ha mais de 2 minutos."

        - alert: KubeContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace="app",
              reason="OOMKilled"
            } == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} morto por OOM"
            description: "Container {{ $labels.container }} no pod {{ $labels.pod }} foi encerrado por falta de memoria (OOMKilled)."
